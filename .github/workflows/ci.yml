name: Vector CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check, test, and measure coverage
        run: npm run check && npm run test:coverage
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run contract tests and invariants
        working-directory: contracts
        run: forge test -vvv
